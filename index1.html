<!DOCTYPE html>
<html>
<head>
    <title>Login Form Validation</title>
</head>
<body>

<h2>Login Form</h2>

<form id="loginForm" onsubmit="return validateForm()">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name">

    <label for="email">Email:</label>
    <input type="text" id="email" name="email">

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">

    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" name="confirmPassword">

    <div id="errorMsg"></div>

    <button type="submit">Register</button>
</form>

<script>
function validateForm(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // 1. Name is not empty
    if (name === "") {
        document.getElementById('errorMsg').innerText = "Name cannot be empty.";
        return false;
    }

    // 2. Email format check using regex
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        document.getElementById('errorMsg').innerText = "Please enter a valid email address.";
        return false;
    }
    if (password === "") {
        document.getElementById('errorMsg').innerText = "password cannot be empty.";
        return false;
    }
    // 3. Passwords match check
    if (password !== confirmPassword) {
        document.getElementById('errorMsg').innerText = "Passwords do not match.";
        return false;
    }

    alert("Form submitted successfully!");
    return true; // Submit form
}
</script>

</body>
</html>
